name: NSW Commute Android APK

on:
  push:
    branches: [claude/nsw-traffic-train-app-vctlxz, main, master]
    paths:
      - 'commute/**'
      - '.github/workflows/nsw-commute-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commute
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Copy web app into Android assets
        run: node android/sync-web.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Optional: set these repository secrets for a stable signing key, so new
      # versions install as updates. Without them the APK is signed with a
      # temporary debug key and must be uninstalled before installing a new build.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Package APK
        id: package
        run: |
          name="NSW-Commute-${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${name}.apk"
          (cd dist && zip -9 "${name}.zip" "${name}.apk")
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: commute/dist/*
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nsw-commute-build-${{ github.run_number }}
          name: NSW Commute build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Android APK for NSW Commute, built from ${{ github.sha }}.
            On your phone, download the .apk file below and open it to install
            (allow installs from your browser or Files app when asked).
          files: |
            commute/dist/*.apk
            commute/dist/*.zip
